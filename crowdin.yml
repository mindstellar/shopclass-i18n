# Four locales here predate Crowdin's codes and keep their historical names, because
# sites already have them installed under those names. Without a mapping Crowdin
# exports Arabic to ar_SA/, Hebrew to he_IL/, Japanese to ja_JP/ and Ukrainian to
# uk_UA/ -- new folders with no locale.json, which npm run check rejects, while the
# real locales receive nothing. The mapping is repeated rather than anchored: not
# every Crowdin config reader follows YAML aliases.
# The project stores files by their full path (develop/src/templates/core.pot). Without
# this the Crowdin CLI strips the prefix every source shares and looks for
# develop/core.pot instead, so crowdin-upload.yml failed with "does not exist in the
# project" on its first run.
preserve_hierarchy: true

files:
  - source: /src/templates/*.pot
    translation: /src/translations/%locale_with_underscore%/%file_name%.po
    languages_mapping:
      locale_with_underscore:
        ar: ar_SY
        he: he_HE
        ja: ja_JA
        uk: uk_UK
  - source: /src/templates/mail.json
    translation: /src/translations/%locale_with_underscore%/%original_file_name%
    languages_mapping:
      locale_with_underscore:
        ar: ar_SY
        he: he_HE
        ja: ja_JA
        uk: uk_UK
    # Only these three. fk_i_page_id and s_internal_name name the mail to the sender
    # and must come from the source -- translated, they drift: Crowdin held "8" as the
    # German for the id "9" and wrote that label onto template 9's body, which is how
    # #59, #60 and #61 each deleted email_warn_expiration from 30 locales.
    #
    # $.language belongs here even though it is not prose. Each locale's
    # "language": "de_DE" is a stored translation of the source "en_US"; drop it and
    # every exported file says en_US, which npm run check refuses on all 30 locales.
    #
    # The GitHub integration does not read this list. It created the file on
    # 2026-09-16 with every field translatable -- 89 strings where there should be 45 --
    # and a CLI upload of the source does not correct it. Fixing an already-imported
    # file means patching its import options over the API; this list is what to patch
    # it to, and what the CLI uses for a file it creates itself.
    translatable_elements:
      - '$.language'
      - '$.template[*].s_title'
      - '$.template[*].s_description'
