# Keeps locale versions honest and packs installable.
#
# Crowdin pushes translations here directly, so nothing human is in the loop to
# bump a version -- which is why every locale sat at 1.0.2 while the translations
# under them changed. This bumps whatever actually changed in the push, then
# refuses anything that would be uninstallable.
#
# Versions move on develop only. master is never edited: at a Shopclass release it
# takes develop as it stands, versions included. A bump committed on master would be a
# commit develop lacks, and the next release merge would conflict on that very line.
name: Bump and check

on:
  push:
    branches: [master, develop]
    paths:
      - 'src/translations/**'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

# Merging several translation PRs in the same minute starts one run per merge, and
# they pushed their bumps at the same moment: one won, the other died on "! [rejected]
# master -> master (fetch first)" and its bump was simply lost. Runs on a branch now
# queue instead of overlapping -- cancelling is wrong here, a cancelled run is a
# locale left on a stale version.
concurrency:
  group: bump-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Two commits, so the push can be compared against what came before it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate every locale
        run: npm run check

      - name: Bump versions for locales this push changed
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: node scripts/bump.mjs --since HEAD~1

      - name: Rebuild the locale index
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: npm run build-list

      - name: Commit the bumps
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          if git diff --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/translations/*/locale.json locale_list.json
          git commit -m "Bump versions for the locales this push changed"
          # Queueing keeps two runs from pushing at once, but a queued run still
          # checked out the commit that triggered it, so it is behind whatever the
          # run before it pushed. Rebase onto the branch before pushing, and retry:
          # a merge landing mid-push must not cost a bump.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 5))
          done
          echo "could not push the bumps after 5 attempts"
          exit 1
